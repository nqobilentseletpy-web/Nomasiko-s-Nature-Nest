<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account | Captivating Scents</title><link rel="stylesheet" href="styles.css"></head><body><div id="shared-header"></div><main><section class="page-hero"><p class="eyebrow">THE INNER CIRCLE</p><h1>Welcome to <em>your scent club.</em></h1><p>Register for updates and promotional announcements.</p></section><section class="account-wrap wrap"><div class="account-tabs"><button class="tab active" data-tab="register">Create account</button><button class="tab" data-tab="login">Sign in</button></div><form id="register-form" class="data-form account-form"><label>Your name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Create password<input name="password" type="password" minlength="8" required></label><label class="check"><input type="checkbox" name="consent" required> I agree to receive account and promotional updates by email.</label><button class="btn">Register</button><p class="form-status" aria-live="polite"></p></form><form id="login-form" class="data-form account-form hidden"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p class="form-status" aria-live="polite"></p></form><p class="small muted">Demo account feature: accounts are stored only in this browser and passwords are not securely managed. Do not use a real password. Use a proper authentication provider before public launch.</p></section></main><div id="shared-footer"></div><script src="script.js"></script></body></html>
